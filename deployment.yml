```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-microservice
  template:
    metadata:
      labels:
        app: student-microservice
    spec:
      containers:
        - name: student-api
          image: student-microservice:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

---

apiVersion: v1
kind: Service
metadata:
  name: student-service
spec:
  selector:
    app: student-microservice
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
```